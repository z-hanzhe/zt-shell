name: 跨平台打包并自动发布

run-name: 发布 ${{ github.ref_name }}

on:
  push:
    tags:
      - "**"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-version:
    name: 校验版本与更新说明
    runs-on: ubuntu-22.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: 校验发布脚本
        run: node --test scripts/release.test.mjs

      - name: 校验各清单版本、标签与更新说明
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release.mjs validate "$RELEASE_TAG"

  build:
    name: 打包 ${{ matrix.name }}
    needs: validate-version
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            rust-target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles msi,nsis --ci
          - name: macOS Apple Silicon
            platform: macos-latest
            rust-target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg --ci
          - name: macOS Intel
            platform: macos-latest
            rust-target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles app,dmg --ci
          - name: Linux x64
            platform: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu --bundles deb,rpm,appimage --ci

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Linux 构建依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: 配置 Rust stable
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target "${{ matrix.rust-target }}"
          rustup default stable

      - name: 缓存 Rust 依赖与构建产物
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rust-${{ runner.os }}-${{ matrix.rust-target }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ matrix.rust-target }}-

      - name: 安装前端依赖
        run: npm ci

      - name: 清理缓存中的旧安装包
        run: |
          node -e "require('node:fs').rmSync('src-tauri/target/${{ matrix.rust-target }}/release/bundle', { recursive: true, force: true })"

      - name: 构建并签名安装包
        uses: tauri-apps/tauri-action@v1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.ZTSHELL_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.ZTSHELL_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}
          retryAttempts: 2
          uploadUpdaterJson: false

      - name: 校验签名并归档当前平台产物
        run: node scripts/release.mjs stage "${{ matrix.rust-target }}" release-assets

      - name: 保存当前平台产物
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.rust-target }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: 汇总更新清单并正式发布
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: 下载全部签名安装包
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: 校验完整产物并生成更新清单
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release.mjs manifest release-assets "$GITHUB_REPOSITORY" "$RELEASE_TAG"

      - name: 上传完整附件后正式发布
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version')"
          notes="release-notes/$version.md"
          mapfile -d '' assets < <(find release-assets -type f -print0)

          if release_is_draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [[ "$release_is_draft" != "true" ]]; then
              echo "对应 Release 已正式发布，拒绝覆盖现有附件。" >&2
              exit 1
            fi
            # 清理失败重跑遗留的草稿附件，避免旧清单或旧安装包混入正式发布。
            while IFS= read -r asset; do
              gh release delete-asset "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY" --yes
            done < <(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
              --title "ZTShell $RELEASE_TAG" --notes-file "$notes"
          fi

          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --title "ZTShell $RELEASE_TAG" --notes-file "$notes" --draft=false --latest
